name: Deploy site to GitHub Pages

# Set Settings > Pages > Source to "GitHub Actions" before running this workflow.
# That setting is only available in the GitHub interface.

# The workflow is manual until Pages is configured. Uncomment the push trigger when
# automatic publishing is ready to be enabled.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   # Trigger only for paths that affect the rendered site.
  #   paths:
  #     - 'site/**'
  #     - 'assets/**'
  #     - 'astro.config.mjs'
  #     - 'package.json'
  #     - 'package-lock.json'
  #     - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Run only one deployment at a time without interrupting a release in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Validate inventory data
        # Fail before deployment when images are missing, English content is incomplete,
        # or filenames violate CONVENTIONS.md. The validator uses only the standard library.
        run: python3 scripts/check_inventory_data.py

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          # astro.config.mjs sets outDir to _site instead of the default dist directory.
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
